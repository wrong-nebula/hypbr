[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypbr"
version = "1.1.0"
description = "500-material agent-ready seamless PBR atlas + hybrid neural/procedural PBR synthesizer (15 calibrated maps)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wrong-nebula" }]
keywords = ["pbr", "procedural-textures", "materials", "normal-map", "hbao", "computer-graphics", "depth-pro"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Optional PyTorch acceleration for procedural synthesis (CUDA/MPS kernels). Not needed on CPU:
# without torch every procedural op runs an equivalent NumPy implementation.
gpu = [
    "torch>=2.1",
]
# Neural photo-to-PBR (`hypbr photo`, neural weathering); also needs Apple Depth Pro (`depth_pro_2`).
neural = [
    "torch>=2.1",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hypbr = "hypbr.cli:main"

[project.urls]
Homepage = "https://github.com/wrong-nebula/hypbr"
Repository = "https://github.com/wrong-nebula/hypbr"

[tool.setuptools.packages.find]
include = ["hypbr*"]

[tool.setuptools.package-data]
hypbr = ["data/*.json"]
