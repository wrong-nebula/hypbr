name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          HYPBR_DEVICE: cpu
        run: pytest -v

  test-no-torch:
    # Procedural synthesis must work with only numpy + pillow installed (torch is an optional extra).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package without torch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if python -c "import torch" 2>/dev/null; then echo "torch must not be installed" && exit 1; fi

      - name: Run pytest (neural-only tests skip)
        env:
          HYPBR_DEVICE: cpu
        run: pytest -v -rs
